<style>
/* Layout: an open picture book on a dark forest-green table. Picture on the left page, words on the right; one page at a time on phones. Single deliberate look in both themes. */
:root{
  --table:#183128;
  --table-2:#24463a;
  --paper:#fdf8ec;
  --ink:#2a2233;
  --ink-soft:#6c6275;
  --ladybird:#d8402f;
  --gold:#e8b23a;
  --leaf-blue:#2f6fd0;
  --cover:#1d3570;
  --on-dark:#fbf3dc;
  --display:"Grandstander","Comic Sans MS","Trebuchet MS",sans-serif;
  --body:"Andika","Trebuchet MS","Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;background:radial-gradient(120% 90% at 50% 40%,var(--table-2),var(--table) 70%);
  color:var(--on-dark);font-family:var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;
}
.app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-block:12px;box-sizing:border-box}
.stage{position:relative;display:flex;justify-content:center;width:100%}
.book{position:relative;perspective:2400px;transition:transform .9s cubic-bezier(.645,.045,.355,1);touch-action:pan-y;cursor:pointer;-webkit-user-select:none;user-select:none}
.book.single{overflow:hidden;border-radius:6px}
.sheet{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.645,.045,.355,1)}
.book.spread .sheet{left:var(--pw)}
.book.single .sheet{left:0}
.sheet.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--paper);color:var(--ink);box-shadow:0 14px 34px rgba(0,0,0,.35)}
.face.front{border-radius:0 6px 6px 0}
.face.back{transform:rotateY(180deg);border-radius:6px 0 0 6px}
.book.single .face{border-radius:6px}
.face::after{content:"";position:absolute;inset:0;pointer-events:none}
.face.front::after{background:linear-gradient(90deg,rgba(60,40,20,.18),rgba(60,40,20,0) 7%)}
.face.back::after{background:linear-gradient(270deg,rgba(60,40,20,.18),rgba(60,40,20,0) 7%)}
.book.single .face::after{background:linear-gradient(90deg,rgba(60,40,20,.12),rgba(60,40,20,0) 4%)}
.face.blank{background:var(--paper)}

/* picture pages */
.pic{position:absolute;inset:4.5%;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(42,34,51,.12)}
.pic svg{width:100%;height:100%;display:block}

/* words pages */
.txt{position:absolute;inset:0;container-type:size;display:flex;flex-direction:column;padding:11% 11% 13%;box-sizing:border-box}
.words{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.75em;font-size:var(--fs,22px);line-height:1.5;min-height:0}
.words p{margin:0;text-wrap:pretty}
.words p.first::first-letter{font-family:var(--display);font-weight:800;color:var(--ladybird);float:left;font-size:3.1em;line-height:.9;margin:.06em .1em 0 0}
.folio{position:absolute;left:0;right:0;bottom:5%;text-align:center;font-family:var(--display);font-weight:600;color:var(--ink-soft);font-size:clamp(12px,3.4cqw,18px);letter-spacing:.06em}
.folio::before,.folio::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);vertical-align:middle;margin:0 .6em}

/* cover & end */
.cover{background:var(--cover);color:var(--on-dark);container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:9% 8% 8%;box-sizing:border-box;text-align:center}
.cover::before{content:"";position:absolute;inset:3.5%;border:2px solid var(--gold);border-radius:10px;opacity:.7;pointer-events:none}
.cover h1{margin:0;font-family:var(--display);font-weight:800;font-size:12.5cqw;line-height:.98;color:#ffd84a;text-wrap:balance;text-shadow:0 3px 0 #0e1d44}
.cover .by{font-family:var(--display);font-weight:600;font-size:6.5cqw;color:var(--on-dark)}
.cover .art{width:100%;flex:1;min-height:0;display:flex;align-items:center}
.cover .art svg{width:100%;height:100%}
.end{background:var(--paper);container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqh;text-align:center}
.end h2{margin:0;font-family:var(--display);font-weight:800;font-size:15cqw;color:var(--ladybird)}
.end .art{width:46cqw;height:46cqw}
.end p{margin:0;font-family:var(--display);font-weight:600;color:var(--ink-soft);font-size:5cqw}

/* controls */
.controls{display:flex;align-items:center;gap:14px}
.controls button{appearance:none;border:0;background:var(--gold);color:#3a2608;font-family:var(--display);font-weight:800;font-size:16px;border-radius:999px;padding:10px 18px;cursor:pointer;box-shadow:0 3px 0 #a87a14}
.controls button:disabled{opacity:.35;cursor:default}
.controls button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.controls button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #a87a14}
.label{font-family:var(--display);font-weight:600;min-width:9.5em;text-align:center;font-size:15px;color:var(--on-dark)}
.hint{font-size:13px;color:rgba(251,243,220,.6);margin:0}
@media (prefers-reduced-motion:reduce){.sheet,.book{transition:none}}
</style>
</head>

</template>

<main class="app">
  <div class="stage"><div class="book" id="book" aria-live="polite"></div></div>
  <div class="controls">
    <button id="prev" type="button" aria-label="Previous page">&#8592; Back</button>
    <span class="label" id="label">Cover</span>
    <button id="next" type="button" aria-label="Next page">Next &#8594;</button>
  </div>
  <p class="hint">Tap the page, swipe, or use the arrow keys to turn</p>
</main>

<script>
(function(){
const story = [
  ["Once upon a time, there was a boy called Max who loved adventures.",
   "Max and his family were on a camping trip. Max and his dad collected wood and made a cosy fire. The family gathered around it and enjoyed their dinner. They ate burgers filled with meat and cheese as well as marshmallows, which were pink and white."],
  ["The next morning, Max went to explore the forest. There he spotted something strange on the ground. It was a glowing blue and gold leaf. Suddenly, a mysterious force pulled his foot towards it and made him step on the leaf."],
  ["His whole body began to tingle.In a flash, Max transformed into a dragonfly! He had spiky legs, enormous googly eyes and a scaly body. Max was frightened. He didn’t know how to get back to his tent or turn into a human again. Then he realised something amazing: he could fly!"],
  ["He spread his wings and flew. Suddenly, an invisible force pulled him towards a little palace made of mud and sand, like a tiny sandcastle.",
   "Inside lived the Bug King."],
  ["The Bug King was a ladybird wearing a red vest, a blue shirt and green pants.",
   "“Who are you? And what are you doing here?” he asked.",
   "Max explained how he had stepped on the glowing blue-and-gold leaf and turned into a dragonfly. He begged him to help him become human again so he could return to his family.",
   "“I can help you,” said the Bug King, “but only if you answer my questions about bugs.”"],
  ["Max felt confident. He had learned about bugs at school a couple of days earlier with Mr Top.",
   "The Bug King politely offered Max some food, which was greenflies, pollen and a small glass of water droplets. Max wasn’t sure what dragonflies ate, but he thanked him and drank the water droplets."],
  ["“Let’s begin!” said the Bug King.",
   "“Which bug can taste with its feet?”",
   "“A butterfly!” answered Max.",
   "“Which body part do fireflies use to make light?”",
   "“Their bottom!” Max replied."],
  ["“Which bug can carry something heavier than its own body weight?”",
   "“An ant!”",
   "“Which insect has ears on its front legs?”",
   "“A grasshopper!” Max answered again.",
   "The Bug King was amazed.",
   "“Well done, Max! You answered all my questions correctly. You really are clever!”"],
  ["“If you ever want to visit the Bug World again, all you have to do is step on this leaf,” the Bug king said, handing Max the magical leaf.",
   "The Bug King waved his hands and shouted his magical spell:",
   "“buggada!”",
   "Max could now feel his hands and legs but felt sad that his wings had disappeared."],
  ["But as he looked around he found himself lying in his own bed. Was it all just a dream?, he wondered. He pulled the covers over himself and was about to go back to sleep when he noticed something glowing. It was the blue-and-gold leaf!",
   "Max stared at it in surprise. Maybe it hadn’t been a dream after all."]
];

const tpl = id => document.getElementById(id).innerHTML;
function coverFace(el){
  el.classList.add('cover');
  el.innerHTML = '<h1>The Opposite World</h1><div class="art">'+tpl('coverArt')+'</div><div class="by">By Ved</div>';
}
function picFace(el,i){ el.innerHTML = '<div class="pic">'+tpl('scene'+(i+1))+'</div>'; }
function txtFace(el,i){
  const t = document.createElement('div'); t.className='txt';
  const w = document.createElement('div'); w.className='words';
  story[i].forEach((s,j)=>{ const p=document.createElement('p'); p.textContent=s; if(i===0&&j===0)p.className='first'; w.appendChild(p); });
  const f = document.createElement('div'); f.className='folio'; f.textContent = i+1;
  t.append(w,f); el.appendChild(t);
}
function endFace(el){
  el.classList.add('end');
  el.innerHTML = '<div class="art">'+tpl('endArt')+'</div><h2>The End</h2><p>A story by Ved</p>';
}
// faces in reading order: cover, then picture + words for each page, then the end
const faces = [ el=>coverFace(el) ];
story.forEach((_,i)=>{ faces.push(el=>picFace(el,i)); faces.push(el=>txtFace(el,i)); });
faces.push(el=>endFace(el));
const N = faces.length; // 22

const book = document.getElementById('book');
const prevB = document.getElementById('prev'), nextB = document.getElementById('next'), label = document.getElementById('label');
let mode = null, sheets = [], k = 0, faceIdx = 0, pw = 0, ph = 0;

function fitText(){
  book.querySelectorAll('.words').forEach(w=>{
    const box = w.parentElement;
    let fs = Math.min(box.clientWidth*0.058, box.clientHeight*0.05, 30);
    w.style.setProperty('--fs', fs+'px');
    let guard = 0;
    while(w.scrollHeight > w.clientHeight + 1 && fs > 6 && guard++ < 60){ fs -= 0.5; w.style.setProperty('--fs', fs+'px'); }
  });
}

function build(){
  const vw = window.innerWidth - 32, vh = window.innerHeight - 120;
  const newMode = 'spread';
  const r = 0.75;
  if(newMode==='spread'){ pw = Math.min(vw/2, vh*r, 560); }
  else { pw = Math.min(vw, vh*r, 560); }
  pw = Math.floor(pw); ph = Math.floor(pw/r);
  const changed = newMode !== mode; mode = newMode;
  book.className = 'book '+mode;
  book.style.setProperty('--pw', pw+'px'); book.style.setProperty('--ph', ph+'px');
  book.style.width = (mode==='spread'?2*pw:pw)+'px'; book.style.height = ph+'px';
  if(changed || !sheets.length){
    book.innerHTML=''; sheets=[];
    const count = mode==='spread' ? N/2 : N;
    for(let s=0;s<count;s++){
      const sh = document.createElement('div'); sh.className='sheet';
      const fr = document.createElement('div'); fr.className='face front';
      const bk = document.createElement('div'); bk.className='face back';
      if(mode==='spread'){ faces[2*s](fr); faces[2*s+1](bk); }
      else { faces[s](fr); bk.classList.add('blank'); }
      sh.append(fr,bk); book.appendChild(sh); sheets.push(sh);
    }
    k = mode==='spread' ? Math.ceil(faceIdx/2) : faceIdx;
    render(true);
  } else render(true);
  fitText();
}

function maxK(){ return mode==='spread' ? sheets.length : sheets.length-1; }

function render(instant){
  if(instant) sheets.forEach(s=>s.style.transition='none');
  sheets.forEach((s,i)=>{
    const f = i < k;
    s.classList.toggle('flipped', f);
    s.style.zIndex = f ? i+1 : sheets.length - i;
    if(mode==='single') s.setAttribute('aria-hidden', i===k ? 'false':'true');
  });
  if(mode==='spread'){
    const shift = k===0 ? -pw/2 : (k===sheets.length ? pw/2 : 0);
    if(instant) book.style.transition='none';
    book.style.transform = 'translateX('+shift+'px)';
  } else book.style.transform='';
  if(instant){ book.offsetWidth; sheets.forEach(s=>s.style.transition=''); book.style.transition=''; }
  faceIdx = mode==='spread' ? Math.min(2*k, N-1) : k;
  prevB.disabled = k===0; nextB.disabled = k===maxK();
  label.textContent = pageLabel();
}

function pageLabel(){
  if(mode==='spread'){
    if(k===0) return 'Cover';
    if(k===sheets.length) return 'The End';
    return 'Page '+k+' of 10';
  }
  if(k===0) return 'Cover';
  if(k===N-1) return 'The End';
  return 'Page '+Math.ceil(k/2)+' of 10';
}

function go(d){
  const nk = Math.max(0, Math.min(maxK(), k+d));
  if(nk===k) return;
  const moving = d>0 ? sheets[k] : sheets[nk];
  moving.style.zIndex = 999;
  k = nk;
  sheets.forEach((s,i)=>{ s.classList.toggle('flipped', i<k); if(s!==moving) s.style.zIndex = i<k ? i+1 : sheets.length-i; if(mode==='single') s.setAttribute('aria-hidden', i===k?'false':'true'); });
  clearTimeout(moving._t);
  moving._t = setTimeout(()=>{ const i = sheets.indexOf(moving); moving.style.zIndex = i<k ? i+1 : sheets.length-i; }, 900);
  if(mode==='spread'){
    const shift = k===0 ? -pw/2 : (k===sheets.length ? pw/2 : 0);
    book.style.transform = 'translateX('+shift+'px)';
  }
  faceIdx = mode==='spread' ? Math.min(2*k, N-1) : k;
  prevB.disabled = k===0; nextB.disabled = k===maxK();
  label.textContent = pageLabel();
}

prevB.addEventListener('click', ()=>go(-1));
nextB.addEventListener('click', ()=>go(1));
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); go(1); }
  if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(-1); }
});
let sx=null, sy=null, swiped=false;
book.addEventListener('pointerdown', e=>{ sx=e.clientX; sy=e.clientY; swiped=false; });
book.addEventListener('pointerup', e=>{
  if(sx===null) return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)){ swiped=true; go(dx<0?1:-1); }
});
book.addEventListener('click', e=>{
  if(swiped){ swiped=false; return; }
  const r = book.getBoundingClientRect();
  const x = (e.clientX - r.left)/r.width;
  if(mode==='spread'){ go(x>=0.5?1:-1); }
  else { go(x>=0.35?1:-1); }
});
let rt; window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(build,120); });
build();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitText);
})();
</script>
